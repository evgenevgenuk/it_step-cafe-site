<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бронювання — Кав'ярня «Зерно»</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>Кав'ярня «Зерно»</h1>
  <nav>
    <a href="index.html#menu">Меню</a>
    <a href="booking.html">Бронювання</a>
    <a href="#contacts">Контакти</a>
  </nav>
</header>

<main>
  <section>
    <h2>Бронювання столика</h2>
    <form action="#" method="post">
      <label for="name">Ім'я</label>
      <input type="text" id="name" name="name" required>

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required>

      <label for="guests">Кількість гостей</label>
      <select id="guests" name="guests">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5+</option>
      </select>

      <label for="comment">Коментар</label>
      <textarea id="comment" name="comment" rows="4"></textarea>

      <button type="submit">Забронювати</button>
    </form>
  </section>
</main>

<footer id="contacts">
  <p>Адреса: м. Львів, вул. Шевченка, 12</p>
</footer>

</body>
</html>
